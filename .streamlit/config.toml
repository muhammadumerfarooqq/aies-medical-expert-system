[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F7F6"
textColor = "#1F2933"
font = "Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif"
baseFontSize = 18

[browser]
gatherUsageStats = false

[server]
# Only this computer can open the app (not other devices on the same Wi-Fi).
address = "localhost"

[client]
# Hide the "Deploy" button and developer menu so the demo looks clean.
toolbarMode = "minimal"
